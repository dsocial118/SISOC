name: Despliegue automatizado

on:
    push:
        branches:
            - development
            - homologacion
            - main
    workflow_dispatch:
        inputs:
            maintenance_action:
                description: "Accion manual de produccion; deploy conserva el flujo normal"
                required: true
                type: choice
                default: deploy
                options:
                    - deploy
                    - inspect-cdi-talla-blockers

permissions: { contents: read }

concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: false }

jobs:
    deploy-qa:
        if: github.ref == 'refs/heads/development'
        environment: qa
        runs-on: [self-hosted, sisoc-qa]

        steps:
            - name: Ejecutar deploy local de QA
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment qa o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --no-tags development:refs/remotes/origin/development
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/development)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy QA omitido por revision obsoleta"
                          echo "- Evento: \`$EXPECTED_SHA\`"
                          echo "- origin/development actual: \`$remote_sha\`";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  previous_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  git -C "$APP_ROOT" merge --ff-only origin/development
                  SISOC_ROOT_DIR="$APP_ROOT" bash "$APP_ROOT/scripts/operacion/deploy_verified.sh" \
                      --environment qa \
                      --expected-revision "$EXPECTED_SHA" \
                      --rollback-revision "$previous_sha" \
                      --skip-pull
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de QA"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de QA" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  wait_for "healthcheck de QA" 30 bash "$APP_ROOT/scripts/infra/healthcheck_qa.sh"
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy QA verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_qa.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy-homologacion:
        if: github.ref == 'refs/heads/homologacion'
        environment: homologacion
        runs-on: [self-hosted, sisoc-homologacion]

        steps:
            - name: Ejecutar deploy local de homologacion
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
                  GIT_CONFIG_COUNT: "1"
                  GIT_CONFIG_KEY_0: safe.directory
                  GIT_CONFIG_VALUE_0: /sisoc/SISOC-Mobile
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment homologacion o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/homologacion)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy HML omitido por revision obsoleta"
                          echo "- Evento: \`$EXPECTED_SHA\`"
                          echo "- origin/homologacion actual: \`$remote_sha\`";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

                  [[ "$(git -C "$APP_ROOT" branch --show-current)" == "homologacion" ]]
                  git -C "$APP_ROOT" diff --quiet
                  git -C "$APP_ROOT" diff --cached --quiet
                  deploy_script="$(mktemp "${RUNNER_TEMP:-/tmp}/sisoc-deploy-verified.XXXXXXXX")"
                  git -C "$APP_ROOT" show "$EXPECTED_SHA:scripts/operacion/deploy_verified.sh" > "$deploy_script"
                  SISOC_ROOT_DIR="$APP_ROOT" bash "$deploy_script" \
                      --environment homologacion \
                      --expected-revision "$EXPECTED_SHA"
                  rm -f "$deploy_script"
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de HML"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de HML" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  wait_for "healthcheck de HML" 30 bash "$APP_ROOT/scripts/infra/healthcheck_hml.sh"
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy HML verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_hml.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy-produccion:
        if: >-
            github.ref == 'refs/heads/main' &&
            (github.event_name != 'workflow_dispatch' || inputs.maintenance_action == 'deploy')
        environment: production
        runs-on: [self-hosted, sisoc-produccion]

        steps:
            - name: Ejecutar deploy local de produccion
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment production o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/main)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy produccion omitido por revision obsoleta"
                          echo "- Evento aprobado: \`$EXPECTED_SHA\`"
                          echo "- origin/main actual: \`$remote_sha\`"
                          echo "- Accion requerida: aprobar el job del commit actual.";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  [[ "$(git -C "$APP_ROOT" branch --show-current)" == "main" ]]
                  git -C "$APP_ROOT" diff --quiet
                  git -C "$APP_ROOT" diff --cached --quiet
                  deploy_script="$(mktemp "${RUNNER_TEMP:-/tmp}/sisoc-deploy-verified.XXXXXXXX")"
                  git -C "$APP_ROOT" show "$EXPECTED_SHA:scripts/operacion/deploy_verified.sh" > "$deploy_script"
                  SISOC_ROOT_DIR="$APP_ROOT" bash "$deploy_script" \
                      --environment production \
                      --expected-revision "$EXPECTED_SHA"
                  rm -f "$deploy_script"
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de produccion"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de produccion" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  if ! wait_for "healthcheck de produccion" 30 bash "$APP_ROOT/scripts/infra/healthcheck_prod.sh"; then
                      show_django_diagnostics
                      exit 1
                  fi
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy produccion verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_prod.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    promover-produccion-a-homologacion:
        needs: deploy-produccion
        if: github.ref == 'refs/heads/main' && needs.deploy-produccion.result == 'success'
        runs-on: ubuntu-latest
        env:
            RELEASE_AUTOMATION_APP_CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
            RELEASE_AUTOMATION_APP_PRIVATE_KEY_PRESENT: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY != '' }}
        steps:
            - name: Checkout de la automatizacion desplegada
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Validar GitHub App de automatizacion
              if: ${{ env.RELEASE_AUTOMATION_APP_CLIENT_ID == '' || env.RELEASE_AUTOMATION_APP_PRIVATE_KEY_PRESENT != 'true' }}
              run: |
                  echo "SETUP_BLOCKED: faltan RELEASE_AUTOMATION_APP_CLIENT_ID o RELEASE_AUTOMATION_APP_PRIVATE_KEY."
                  exit 1

            - name: Generar token temporal de GitHub App
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

            - name: Promover la revision desplegada a homologacion
              uses: actions/github-script@v8
              env:
                  PROMOTION_SOURCE: main
                  PROMOTION_TARGET: homologacion
                  DEPLOYED_SHA: ${{ github.sha }}
              with:
                github-token: ${{ steps.app-token.outputs.token }}
                script: |
                    const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync_main_downstream.js`);
                    await run({
                      github,
                      context,
                      core,
                      source: process.env.PROMOTION_SOURCE,
                      target: process.env.PROMOTION_TARGET,
                      deployedSha: process.env.DEPLOYED_SHA,
                    });

    promover-homologacion-a-qa:
        needs: deploy-homologacion
        if: github.ref == 'refs/heads/homologacion' && needs.deploy-homologacion.result == 'success'
        runs-on: ubuntu-latest
        env:
            RELEASE_AUTOMATION_APP_CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
            RELEASE_AUTOMATION_APP_PRIVATE_KEY_PRESENT: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY != '' }}
        steps:
            - name: Checkout de la automatizacion desplegada
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Validar GitHub App de automatizacion
              if: ${{ env.RELEASE_AUTOMATION_APP_CLIENT_ID == '' || env.RELEASE_AUTOMATION_APP_PRIVATE_KEY_PRESENT != 'true' }}
              run: |
                  echo "SETUP_BLOCKED: faltan RELEASE_AUTOMATION_APP_CLIENT_ID o RELEASE_AUTOMATION_APP_PRIVATE_KEY."
                  exit 1

            - name: Generar token temporal de GitHub App
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

            - name: Promover la revision desplegada a QA
              uses: actions/github-script@v8
              env:
                  PROMOTION_SOURCE: homologacion
                  PROMOTION_TARGET: development
                  DEPLOYED_SHA: ${{ github.sha }}
              with:
                github-token: ${{ steps.app-token.outputs.token }}
                script: |
                    const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync_main_downstream.js`);
                    await run({
                      github,
                      context,
                      core,
                      source: process.env.PROMOTION_SOURCE,
                      target: process.env.PROMOTION_TARGET,
                      deployedSha: process.env.DEPLOYED_SHA,
                    });

    recuperar-talla-legacy-produccion:
        if: >-
            github.ref == 'refs/heads/main' &&
            github.event_name == 'workflow_dispatch' &&
            inputs.maintenance_action == 'inspect-cdi-talla-blockers'
        environment: production
        runs-on: [self-hosted, sisoc-produccion]

        steps:
            - name: Clasificar tallas legacy bloqueantes
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
                  MAINTENANCE_ACTION: "${{ inputs.maintenance_action }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment production o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/main)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      echo "::error::origin/main avanzo desde el dispatch; no se modifica la base."
                      exit 1
                  fi

                  [[ -f "$APP_ROOT/.env" ]] || {
                      echo "::error::No se encontro el .env de produccion; no se modifica la base."
                      exit 1;
                  }
                  git -C "$APP_ROOT" cat-file -e "$EXPECTED_SHA^{commit}"
                  RECOVERY_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sisoc-legacy-talla.XXXXXX")"
                  cleanup_recovery() {
                      case "$RECOVERY_ROOT" in
                          "${RUNNER_TEMP:-/tmp}"/sisoc-legacy-talla.*)
                              rm -rf -- "$RECOVERY_ROOT"
                              ;;
                          *)
                              echo "::error::Directorio temporal de recuperacion inesperado."
                              ;;
                      esac
                  }
                  trap cleanup_recovery EXIT
                  git -C "$APP_ROOT" archive --format=tar "$EXPECTED_SHA" | tar -x -C "$RECOVERY_ROOT"
                  ln -s "$APP_ROOT/.env" "$RECOVERY_ROOT/.env"

                  PROD_EXPECTED_DB_HOST="${PROD_EXPECTED_DB_HOST:-10.80.5.46}"
                  PROD_EXPECTED_DB_SERVER="${PROD_EXPECTED_DB_SERVER:-ldmzsql-sisoc}"
                  PROD_EXPECTED_DB_NAME="${PROD_EXPECTED_DB_NAME:-sisoc_local}"
                  export PROD_EXPECTED_DB_HOST PROD_EXPECTED_DB_SERVER PROD_EXPECTED_DB_NAME

                  recovery=$'from decimal import Decimal, InvalidOperation\nimport os\n\nfrom django.db import connection\n\nEXPECTED_CATEGORIES = {7: "non_numeric", 237: "out_of_range", 242: "non_numeric"}\nMAX_TALLA_DECIMAL = Decimal("9999.9")\nUN_DECIMAL = Decimal("0.1")\nEXPECTED_DB_HOST = os.environ["PROD_EXPECTED_DB_HOST"]\nEXPECTED_DB_SERVER = os.environ["PROD_EXPECTED_DB_SERVER"]\nEXPECTED_DB_NAME = os.environ["PROD_EXPECTED_DB_NAME"]\n\ndef classify_talla(value):\n    if value is None:\n        return "null"\n    text = str(value).strip()\n    if not text:\n        return "blank"\n    try:\n        decimal_value = Decimal(text.replace(",", "."))\n    except InvalidOperation:\n        return "non_numeric"\n    if not decimal_value.is_finite():\n        return "non_finite"\n    if abs(decimal_value) > MAX_TALLA_DECIMAL:\n        return "out_of_range"\n    try:\n        normalized = decimal_value.quantize(UN_DECIMAL)\n    except InvalidOperation:\n        return "too_many_decimals"\n    if decimal_value != normalized:\n        return "too_many_decimals"\n    return "convertible"\n\ndef validate_database_identity():\n    connection.ensure_connection()\n    with connection.cursor() as cursor:\n        cursor.execute("SELECT @@hostname, DATABASE()")\n        actual_server, actual_database = cursor.fetchone()\n    if (\n        str(connection.settings_dict.get("HOST")) != EXPECTED_DB_HOST\n        or str(actual_server) != EXPECTED_DB_SERVER\n        or str(actual_database) != EXPECTED_DB_NAME\n    ):\n        raise RuntimeError("La conexion no coincide con la base de produccion esperada.")\n\ndef read_categories(cursor):\n    categories = {}\n    for record_id in EXPECTED_CATEGORIES:\n        cursor.execute(\n            "SELECT talla FROM centrodeinfancia_nominacentroinfancia WHERE id = %s",\n            [record_id],\n        )\n        row = cursor.fetchone()\n        categories[record_id] = "record_missing" if row is None else classify_talla(row[0])\n    return categories\n\ndef print_categories(categories):\n    for record_id in sorted(categories):\n        print(f"legacy_talla_id={record_id} category={categories[record_id]}")\n\naction = os.environ["MAINTENANCE_ACTION"]\nif action != "inspect-cdi-talla-blockers":\n    raise RuntimeError("Accion de mantenimiento no permitida.")\n\nvalidate_database_identity()\nwith connection.cursor() as cursor:\n    categories = read_categories(cursor)\nprint_categories(categories)'
                  docker compose --project-name sisoc \
                      -f "$RECOVERY_ROOT/docker-compose.deploy.yml" \
                      -f "$RECOVERY_ROOT/docker-compose.produccion.yml" \
                      --project-directory "$RECOVERY_ROOT" run --rm --no-deps \
                      -e MAINTENANCE_ACTION \
                      -e PROD_EXPECTED_DB_HOST \
                      -e PROD_EXPECTED_DB_SERVER \
                      -e PROD_EXPECTED_DB_NAME \
                      --entrypoint python django manage.py shell -c "$recovery"
