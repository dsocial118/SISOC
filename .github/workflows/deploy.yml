name: Despliegue automatizado

on:
    push:
        branches:
            - development
            - homologacion
            - main
    workflow_dispatch:
        inputs:
            maintenance_action:
                description: "Accion manual de produccion; deploy conserva el flujo normal"
                required: true
                type: choice
                default: deploy
                options:
                    - deploy
                    - inspect-cdi-talla-blockers
                    - repair-confirmed-cdi-talla-blockers-as-null

permissions: { contents: read }

concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: false }

jobs:
    deploy-qa:
        if: github.ref == 'refs/heads/development'
        environment: qa
        runs-on: [self-hosted, sisoc-qa]

        steps:
            - name: Ejecutar deploy local de QA
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment qa o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/development)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy QA omitido por revision obsoleta"
                          echo "- Evento: \`$EXPECTED_SHA\`"
                          echo "- origin/development actual: \`$remote_sha\`";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  echo "Commit previo al deploy para rollback: $(git rev-parse HEAD)"
                  ./scripts/operacion/deploy_refresh.sh --yes --expected-revision "$EXPECTED_SHA"
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de QA"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de QA" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  wait_for "healthcheck de QA" 30 bash "$APP_ROOT/scripts/infra/healthcheck_qa.sh"
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy QA verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_qa.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy-homologacion:
        if: github.ref == 'refs/heads/homologacion'
        environment: homologacion
        runs-on: [self-hosted, sisoc-homologacion]

        steps:
            - name: Ejecutar deploy local de homologacion
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
                  GIT_CONFIG_COUNT: "1"
                  GIT_CONFIG_KEY_0: safe.directory
                  GIT_CONFIG_VALUE_0: /sisoc/SISOC-Mobile
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment homologacion o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/homologacion)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy HML omitido por revision obsoleta"
                          echo "- Evento: \`$EXPECTED_SHA\`"
                          echo "- origin/homologacion actual: \`$remote_sha\`";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  if ! grep -q -- "--expected-revision" "$APP_ROOT/scripts/operacion/deploy_refresh.sh"; then
                      [[ "$(git -C "$APP_ROOT" branch --show-current)" == "homologacion" ]] || {
                          echo "::error::El checkout de HML no esta en la branch homologacion."
                          exit 1;
                      }
                      echo "[deploy] Actualizando el helper local de HML antes del deploy versionado."
                      git -C "$APP_ROOT" merge --ff-only origin/homologacion
                  fi
                  MOBILE_ROOT=/sisoc/SISOC-Mobile
                  if ! git -C "$MOBILE_ROOT" fetch origin --prune; then
                      echo "::warning::El checkout movil no puede actualizarse; reparando permisos de su metadata git."
                      docker run --rm --user 0:0 \
                          -v "$MOBILE_ROOT/.git:/target" \
                          --entrypoint chown sisoc-django \
                          -R "$(id -u):$(id -g)" /target
                      git -C "$MOBILE_ROOT" fetch origin --prune
                  fi
                  git -C "$MOBILE_ROOT" update-index --refresh
                  echo "Commit previo al deploy para rollback: $(git rev-parse HEAD)"
                  ./scripts/operacion/deploy_refresh.sh --yes --expected-revision "$EXPECTED_SHA" --with-mobile --mobile-dir "$MOBILE_ROOT"
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de HML"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de HML" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  wait_for "healthcheck de HML" 30 bash "$APP_ROOT/scripts/infra/healthcheck_hml.sh"
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy HML verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_hml.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy-produccion:
        if: >-
            github.ref == 'refs/heads/main' &&
            (github.event_name != 'workflow_dispatch' || inputs.maintenance_action == 'deploy')
        environment: production
        runs-on: [self-hosted, sisoc-produccion]

        steps:
            - name: Ejecutar deploy local de produccion
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment production o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  cd "$APP_ROOT"
                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/main)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      {
                          echo "### Deploy produccion omitido por revision obsoleta"
                          echo "- Evento aprobado: \`$EXPECTED_SHA\`"
                          echo "- origin/main actual: \`$remote_sha\`"
                          echo "- Accion requerida: aprobar el job del commit actual.";
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  if ! grep -q -- "--expected-revision" "$APP_ROOT/scripts/operacion/deploy_refresh.sh"; then
                      [[ "$(git -C "$APP_ROOT" branch --show-current)" == "main" ]] || {
                          echo "::error::El checkout de produccion no esta en la branch main."
                          exit 1;
                      }
                      echo "[deploy] Actualizando el helper local de produccion antes del deploy versionado."
                      git -C "$APP_ROOT" merge --ff-only origin/main
                  fi
                  echo "Commit previo al deploy para rollback: $(git rev-parse HEAD)"
                  ./scripts/operacion/deploy_refresh.sh --yes --expected-revision "$EXPECTED_SHA" --with-mobile --mobile-dir /sisoc/SISOC-Mobile
                  wait_for() {
                      local description="$1"
                      local attempts="$2"
                      local output
                      local attempt
                      shift 2
                      output="$(mktemp)"

                      for ((attempt = 1; attempt <= attempts; attempt++)); do
                          if "$@" >"$output" 2>&1; then
                              cat "$output"
                              rm -f "$output"
                              return 0
                          fi
                          if ((attempt < attempts)); then
                              echo "[deploy] Esperando $description ($attempt/$attempts)..."
                              sleep 2
                          fi
                      done

                      cat "$output"
                      rm -f "$output"
                      echo "::error::$description no estuvo listo luego de $attempts intentos."
                      return 1
                  }

                  show_django_diagnostics() {
                      echo "::group::Diagnostico del servicio django de produccion"
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" ps || true
                      docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" logs --tail 200 django || true
                      echo "::endgroup::"
                  }

                  if ! wait_for "migraciones de produccion" 30 docker compose -f "$APP_ROOT/docker-compose.deploy.yml" -f "$APP_ROOT/docker-compose.produccion.yml" --project-directory "$APP_ROOT" exec -T django python manage.py migrate --check; then
                      show_django_diagnostics
                      exit 1
                  fi
                  if ! wait_for "healthcheck de produccion" 30 bash "$APP_ROOT/scripts/infra/healthcheck_prod.sh"; then
                      show_django_diagnostics
                      exit 1
                  fi
                  deployed_sha="$(git -C "$APP_ROOT" rev-parse HEAD)"
                  [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
                  {
                      echo "### Deploy produccion verificado"
                      echo "- Revision desplegada: \`$deployed_sha\`"
                      echo "- Migraciones: \`migrate --check\` OK"
                      echo "- Health: \`healthcheck_prod.sh\` OK";
                  } >> "$GITHUB_STEP_SUMMARY"

    recuperar-talla-legacy-produccion:
        if: >-
            github.ref == 'refs/heads/main' &&
            github.event_name == 'workflow_dispatch' &&
            (inputs.maintenance_action == 'inspect-cdi-talla-blockers' ||
            inputs.maintenance_action == 'repair-confirmed-cdi-talla-blockers-as-null')
        environment: production
        runs-on: [self-hosted, sisoc-produccion]

        steps:
            - name: Clasificar o reparar tallas legacy bloqueantes
              shell: bash
              env:
                  GH_APP_ROOT: "${{ vars.APP_ROOT }}"
                  EXPECTED_SHA: "${{ github.sha }}"
                  MAINTENANCE_ACTION: "${{ inputs.maintenance_action }}"
              run: |
                  set -Eeuo pipefail

                  APP_ROOT="${GH_APP_ROOT:-${APP_ROOT:-}}"
                  if [[ -z "$APP_ROOT" ]]; then
                      echo "::error::APP_ROOT no esta configurado. Definir vars.APP_ROOT en el Environment production o APP_ROOT en el servicio del runner."
                      exit 1
                  fi

                  git -C "$APP_ROOT" fetch origin --prune
                  remote_sha="$(git -C "$APP_ROOT" rev-parse origin/main)"
                  if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
                      echo "::error::origin/main avanzo desde el dispatch; no se modifica la base."
                      exit 1
                  fi

                  [[ -f "$APP_ROOT/.env" ]] || {
                      echo "::error::No se encontro el .env de produccion; no se modifica la base."
                      exit 1;
                  }
                  git -C "$APP_ROOT" cat-file -e "$EXPECTED_SHA^{commit}"
                  RECOVERY_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sisoc-legacy-talla.XXXXXX")"
                  cleanup_recovery() {
                      case "$RECOVERY_ROOT" in
                          "${RUNNER_TEMP:-/tmp}"/sisoc-legacy-talla.*)
                              rm -rf -- "$RECOVERY_ROOT"
                              ;;
                          *)
                              echo "::error::Directorio temporal de recuperacion inesperado."
                              ;;
                      esac
                  }
                  trap cleanup_recovery EXIT
                  git -C "$APP_ROOT" archive --format=tar "$EXPECTED_SHA" | tar -x -C "$RECOVERY_ROOT"
                  ln -s "$APP_ROOT/.env" "$RECOVERY_ROOT/.env"

                  PROD_EXPECTED_DB_HOST="${PROD_EXPECTED_DB_HOST:-10.80.5.46}"
                  PROD_EXPECTED_DB_SERVER="${PROD_EXPECTED_DB_SERVER:-ldmzsql-sisoc}"
                  PROD_EXPECTED_DB_NAME="${PROD_EXPECTED_DB_NAME:-sisoc_local}"
                  export PROD_EXPECTED_DB_HOST PROD_EXPECTED_DB_SERVER PROD_EXPECTED_DB_NAME

                  recovery=$'from decimal import Decimal, InvalidOperation\nimport os\n\nfrom django.db import connection, transaction\n\nEXPECTED_CATEGORIES = {7: "non_numeric", 237: "out_of_range", 242: "non_numeric"}\nMAX_TALLA_DECIMAL = Decimal("9999.9")\nUN_DECIMAL = Decimal("0.1")\nEXPECTED_DB_HOST = os.environ["PROD_EXPECTED_DB_HOST"]\nEXPECTED_DB_SERVER = os.environ["PROD_EXPECTED_DB_SERVER"]\nEXPECTED_DB_NAME = os.environ["PROD_EXPECTED_DB_NAME"]\n\ndef classify_talla(value):\n    if value is None:\n        return "null"\n    text = str(value).strip()\n    if not text:\n        return "blank"\n    try:\n        decimal_value = Decimal(text.replace(",", "."))\n    except InvalidOperation:\n        return "non_numeric"\n    if not decimal_value.is_finite():\n        return "non_finite"\n    if abs(decimal_value) > MAX_TALLA_DECIMAL:\n        return "out_of_range"\n    try:\n        normalized = decimal_value.quantize(UN_DECIMAL)\n    except InvalidOperation:\n        return "too_many_decimals"\n    if decimal_value != normalized:\n        return "too_many_decimals"\n    return "convertible"\n\ndef validate_database_identity():\n    connection.ensure_connection()\n    with connection.cursor() as cursor:\n        cursor.execute("SELECT @@hostname, DATABASE()")\n        actual_server, actual_database = cursor.fetchone()\n    if (\n        str(connection.settings_dict.get("HOST")) != EXPECTED_DB_HOST\n        or str(actual_server) != EXPECTED_DB_SERVER\n        or str(actual_database) != EXPECTED_DB_NAME\n    ):\n        raise RuntimeError("La conexion no coincide con la base de produccion esperada.")\n\ndef read_categories(cursor, lock):\n    categories = {}\n    suffix = " FOR UPDATE" if lock else ""\n    for record_id in EXPECTED_CATEGORIES:\n        cursor.execute(\n            "SELECT talla FROM centrodeinfancia_nominacentroinfancia WHERE id = %s" + suffix,\n            [record_id],\n        )\n        row = cursor.fetchone()\n        categories[record_id] = "record_missing" if row is None else classify_talla(row[0])\n    return categories\n\ndef print_categories(categories):\n    for record_id in sorted(categories):\n        print(f"legacy_talla_id={record_id} category={categories[record_id]}")\n\naction = os.environ["MAINTENANCE_ACTION"]\nif action not in {\n    "inspect-cdi-talla-blockers",\n    "repair-confirmed-cdi-talla-blockers-as-null",\n}:\n    raise RuntimeError("Accion de mantenimiento no permitida.")\n\nvalidate_database_identity()\nif action == "inspect-cdi-talla-blockers":\n    with connection.cursor() as cursor:\n        categories = read_categories(cursor, lock=False)\n    print_categories(categories)\nelse:\n    with transaction.atomic():\n        with connection.cursor() as cursor:\n            categories = read_categories(cursor, lock=True)\n            print_categories(categories)\n            unexpected = {\n                record_id: category\n                for record_id, category in categories.items()\n                if category != EXPECTED_CATEGORIES[record_id]\n            }\n            if unexpected:\n                raise RuntimeError(\n                    f"Las precondiciones de talla legacy no coinciden: {unexpected}"\n                )\n            for record_id in EXPECTED_CATEGORIES:\n                cursor.execute(\n                    "UPDATE centrodeinfancia_nominacentroinfancia SET talla = NULL WHERE id = %s",\n                    [record_id],\n                )\n                if cursor.rowcount != 1:\n                    raise RuntimeError(\n                        f"No se actualizo exactamente un registro legacy: id={record_id}"\n                    )\n    print("legacy_talla_repair=repaired_as_null ids=7,237,242")'
                  docker compose --project-name sisoc \
                      -f "$RECOVERY_ROOT/docker-compose.deploy.yml" \
                      -f "$RECOVERY_ROOT/docker-compose.produccion.yml" \
                      --project-directory "$RECOVERY_ROOT" run --rm --no-deps \
                      -e MAINTENANCE_ACTION \
                      -e PROD_EXPECTED_DB_HOST \
                      -e PROD_EXPECTED_DB_SERVER \
                      -e PROD_EXPECTED_DB_NAME \
                      --entrypoint python django manage.py shell -c "$recovery"
