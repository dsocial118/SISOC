name: Tests automatizados

permissions:
    contents: read
    checks: read

on:
    pull_request:
        branches:
            - development
            - homologacion
            - main
    push:
        branches:
            - development
            - homologacion
            - main

jobs:
    dispositivos_application_contracts:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Set up Python
              uses: actions/setup-python@v6.2.0
              with:
                  python-version: '3.11.15'

            - name: Run Dispositivos application contract tests
              run: python -m unittest discover -s services/dispositivos/tests/unit -p "test_*.py"

    smoke:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT_FORWARD=3307
                  DOCKER_MYSQL_PORT=3306
                  DOCKER_DJANGO_PORT_FORWARD=8000
                  DOCKER_DJANGO_PORT=8000
                  DOCKER_DEBUGGER_PORT_FORWARD=5678
                  DOCKER_DEBUGGER_PORT=5678
                  USE_SQLITE_FOR_TESTS=1
                  EOF

            - name: Run smoke tests in one-off container
              run: docker compose run --build --rm --no-deps -T django pytest -m smoke

    migrations_check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT_FORWARD=3307
                  DOCKER_MYSQL_PORT=3306
                  DOCKER_DJANGO_PORT_FORWARD=8000
                  DOCKER_DJANGO_PORT=8000
                  DOCKER_DEBUGGER_PORT_FORWARD=5678
                  DOCKER_DEBUGGER_PORT=5678
                  EOF

            - name: Build and start services
              run: docker compose up -d --build

            - name: Wait for MySQL
              run: |
                  for i in {1..20}; do
                      if docker compose exec -T mysql mysqladmin ping -h "localhost" -P 3306 --silent; then
                          echo "MySQL is ready!"
                          exit 0
                      fi
                      echo "Waiting for MySQL..."
                      sleep 5
                  done
                  echo "MySQL did not become ready in time."
                  docker compose logs mysql
                  exit 1

            - name: Check pending migrations
              run: docker compose exec -T django python manage.py makemigrations --check --dry-run

            - name: Shutdown services
              if: always()
              run: docker compose down -v

    pytest:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT_FORWARD=3307
                  DOCKER_MYSQL_PORT=3306
                  DOCKER_DJANGO_PORT_FORWARD=8000
                  DOCKER_DJANGO_PORT=8000
                  DOCKER_DEBUGGER_PORT_FORWARD=5678
                  DOCKER_DEBUGGER_PORT=5678
                  USE_SQLITE_FOR_TESTS=1
                  EOF

            - name: Run tests with coverage gate in one-off container
              run: docker compose run --build --rm --no-deps -T django pytest -n auto --cov=. --cov-report=term-missing --cov-fail-under=75

    dispositivos_monolith_compat:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT_FORWARD=3307
                  DOCKER_MYSQL_PORT=3306
                  DOCKER_DJANGO_PORT_FORWARD=8000
                  DOCKER_DJANGO_PORT=8000
                  DOCKER_DEBUGGER_PORT_FORWARD=5678
                  DOCKER_DEBUGGER_PORT=5678
                  USE_SQLITE_FOR_TESTS=1
                  EOF

            - name: Run Dispositivos monolith compatibility tests
              run: docker compose run --build --rm --no-deps -T django pytest services/dispositivos/tests/integration -q

    dispositivos_runtime:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for the Dispositivos runtime
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT=3306
                  DISPOSITIVOS_MYSQL_PORT_FORWARD=3308
                  DOCKER_DJANGO_PORT=8000
                  DISPOSITIVOS_WEB_PORT_FORWARD=8002
                  DISPOSITIVOS_DB_WAIT_ATTEMPTS=12
                  RUN_UID=0
                  RUN_GID=0
                  EOF

            - name: Verify selective runtime topology
              run: |
                  services="$(docker compose -f compose.dispositivos.yml config --services | sort)"
                  expected=$'dispositivos-migrate\ndispositivos-web\nmysql'
                  if [[ "$services" != "$expected" ]]; then
                      echo "Unexpected selective runtime services:"
                      echo "$services"
                      exit 1
                  fi

            - name: Build the named Dispositivos image
              run: docker compose -f compose.dispositivos.yml build dispositivos-web

            - name: Start only the isolated MySQL dependency
              run: docker compose -f compose.dispositivos.yml up -d --no-build mysql

            - name: Wait for isolated MySQL
              run: |
                  for i in {1..20}; do
                      if docker compose -f compose.dispositivos.yml exec -T mysql mysqladmin ping -h "localhost" -P 3306 --silent; then
                          exit 0
                      fi
                      sleep 5
                  done
                  docker compose -f compose.dispositivos.yml logs mysql
                  exit 1

            - name: Run the Dispositivos migration role twice
              run: |
                  docker compose -f compose.dispositivos.yml --profile migrate run --rm --no-deps dispositivos-migrate
                  docker compose -f compose.dispositivos.yml --profile migrate run --rm --no-deps dispositivos-migrate

            - name: Start only the Dispositivos web role
              run: docker compose -f compose.dispositivos.yml up -d --no-build dispositivos-web

            - name: Verify web starts without monolith services or migrations
              run: |
                  expected=$'dispositivos-web\nmysql'
                  running="$(docker compose -f compose.dispositivos.yml ps --services --status running | sort)"
                  if [[ "$running" != "$expected" ]]; then
                      echo "Unexpected running services:"
                      echo "$running"
                      exit 1
                  fi
                  if docker compose -f compose.dispositivos.yml logs dispositivos-web | grep -Eqi 'makemigrations|migrate'; then
                      echo "The web role emitted a migration command."
                      exit 1
                  fi

            - name: Stop and restart the isolated web role
              run: |
                  docker compose -f compose.dispositivos.yml stop dispositivos-web
                  running="$(docker compose -f compose.dispositivos.yml ps --services --status running | sort)"
                  if [[ "$running" != "mysql" ]]; then
                      echo "Unexpected services after stopping web:"
                      echo "$running"
                      exit 1
                  fi
                  docker compose -f compose.dispositivos.yml start dispositivos-web
                  expected=$'dispositivos-web\nmysql'
                  running="$(docker compose -f compose.dispositivos.yml ps --services --status running | sort)"
                  if [[ "$running" != "$expected" ]]; then
                      echo "Unexpected services after restarting web:"
                      echo "$running"
                      exit 1
                  fi

            - name: Shutdown isolated runtime
              if: always()
              run: docker compose -f compose.dispositivos.yml down -v

    mysql_compat:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
                  DATABASE_HOST=mysql
                  DATABASE_PORT=3306
                  DATABASE_USER=root
                  DATABASE_PASSWORD=root1-password2
                  DATABASE_NAME=sisoc-local
                  WAIT_FOR_DB=true
                  DOCKER_MYSQL_PORT_FORWARD=3307
                  DOCKER_MYSQL_PORT=3306
                  DOCKER_DJANGO_PORT_FORWARD=8000
                  DOCKER_DJANGO_PORT=8000
                  DOCKER_DEBUGGER_PORT_FORWARD=5678
                  DOCKER_DEBUGGER_PORT=5678
                  USE_SQLITE_FOR_TESTS=0
                  EOF

            - name: Build and start services
              run: docker compose up -d --build

            - name: Wait for MySQL
              run: |
                  for i in {1..20}; do
                      if docker compose exec -T mysql mysqladmin ping -h "localhost" -P 3306 --silent; then
                          echo "MySQL is ready!"
                          exit 0
                      fi
                      echo "Waiting for MySQL..."
                      sleep 5
                  done
                  echo "MySQL did not become ready in time."
                  docker compose logs mysql
                  exit 1

            - name: Run MySQL compatibility tests
              run: docker compose exec -T django pytest -m mysql_compat -q

            - name: Shutdown services
              if: always()
              run: docker compose down -v

    release_quality:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Validar evidencia de calidad del pre-deploy
              uses: actions/github-script@v8
              with:
                  script: |
                      const body = context.payload.pull_request?.body || "";
                      const missing = [];
                      const hasTextInSection = (heading) => {
                        const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                        const section = new RegExp(
                          `^## ${escaped}\\s*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`,
                          "m",
                        ).exec(body);
                        return Boolean(section && section[1].trim());
                      };
                      const finalRelease = /<!--\s*release-automation:\s*scheduled\s*-->/i.test(body);
                      const preparation = /<!--\s*release-final-pr:\s*\d+\s*-->/i.test(body);

                      if (!finalRelease && !preparation) {
                        core.info("PR fuera del flujo de release automatizado.");
                        return;
                      }

                      if (finalRelease) {
                        if (!/<!--\s*release-date:\s*\d{4}-\d{2}-\d{2}\s*-->/i.test(body)) {
                          missing.push("marker release-date");
                        }
                        if (!/<!--\s*release-head:\s*[0-9a-f]{40}\s*-->/i.test(body)) {
                          missing.push("marker release-head");
                        }
                        if (!/<!--\s*release-preparation:\s*(pending|none|\d+)\s*-->/i.test(body)) {
                          missing.push("marker release-preparation");
                        }
                        for (const heading of [
                          "Resumen ejecutivo",
                          "Riesgos bloqueantes",
                          "Riesgos no bloqueantes",
                          "Pruebas ejecutadas y resultado",
                          "Compatibilidad hacia atrás",
                          "Recomendación final GO/NO-GO con justificación",
                          "Impacto por módulos",
                          "Supuestos explícitos",
                          "Rollback / consideraciones operativas",
                        ]) {
                          if (!hasTextInSection(heading)) {
                            missing.push(`seccion ${heading}`);
                          }
                        }
                      }

                      if (preparation) {
                        const functionalFix = /<!--\s*release-functional-fix:\s*(true|false)\s*-->/i.exec(body);
                        if (!functionalFix) {
                          missing.push("marker release-functional-fix");
                        } else if (functionalFix[1].toLowerCase() === "true") {
                          for (const heading of [
                            "Causa raíz confirmada",
                            "Prueba de regresión",
                            "Revisión de calidad",
                          ]) {
                            if (!hasTextInSection(heading)) {
                              missing.push(`seccion ${heading}`);
                            }
                          }
                        } else if (!hasTextInSection("Validación del saneamiento")) {
                          missing.push("seccion Validación del saneamiento");
                        }
                      }

                      if (missing.length > 0) {
                        core.setFailed(
                          `El pre-deploy no aporta evidencia suficiente: ${missing.join(", ")}`,
                        );
                        return;
                      }
                      core.info("Evidencia de calidad de release verificada.");

    deploy_guard:
        if: ${{ always() && github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        needs:
            - dispositivos_application_contracts
            - smoke
            - migrations_check
            - pytest
            - dispositivos_monolith_compat
            - dispositivos_runtime
            - mysql_compat
            - release_quality
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Ejecutar pruebas de automatizacion de release
              run: node --test .github/scripts/release_orchestrator.test.js .github/scripts/sync_main_downstream.test.js

            - name: Validate required CI checks
              uses: actions/github-script@v8
              with:
                  script: |
                      const baseRef = context.payload.pull_request?.base?.ref ?? "";
                      const required = [
                        "gitleaks",
                        "encoding_check",
                        "black",
                        "djlint",
                        "pylint",
                        "dispositivos_application_contracts",
                        "smoke",
                        "pytest",
                        "dispositivos_monolith_compat",
                        "dispositivos_runtime",
                        "migrations_check",
                        "mysql_compat",
                        "release_quality",
                      ];
                      if (baseRef === "main") {
                        required.push("release_sanity");
                      }
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const ref = context.payload.pull_request?.head?.sha ?? context.sha;
                      const passConclusions = new Set(["success", "neutral", "skipped"]);

                      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                      // PRs hacia main esperan workflows externos (lint y release_sanity)
                      // que pueden durar mas que los jobs propios de este workflow.
                      const maxAttempts = 120;
                      const waitMs = 15000;

                      let checkRuns = [];
                      for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                        const response = await github.rest.checks.listForRef({
                          owner,
                          repo,
                          ref,
                          per_page: 100,
                        });
                        checkRuns = response.data.check_runs;
                        const byName = new Map();
                        for (const run of checkRuns) {
                          const current = byName.get(run.name);
                          if (!current || new Date(run.started_at) > new Date(current.started_at)) {
                            byName.set(run.name, run);
                          }
                        }

                        const pending = required.filter((name) => {
                          const run = byName.get(name);
                          return !run || run.status !== "completed";
                        });

                        if (pending.length === 0) {
                          break;
                        }

                        if (attempt === maxAttempts) {
                          core.setFailed(
                            `Checks requeridos pendientes tras espera: ${pending.join(", ")}`
                          );
                          return;
                        }
                        core.info(`Esperando checks requeridos: ${pending.join(", ")}`);
                        await sleep(waitMs);
                      }

                      const latestByName = new Map();
                      for (const run of checkRuns) {
                        const current = latestByName.get(run.name);
                        if (!current || new Date(run.started_at) > new Date(current.started_at)) {
                          latestByName.set(run.name, run);
                        }
                      }

                      const failed = [];
                      for (const name of required) {
                        const run = latestByName.get(name);
                        if (!run) {
                          failed.push(`${name} (missing)`);
                          continue;
                        }
                        if (!passConclusions.has(run.conclusion)) {
                          failed.push(`${name} (${run.conclusion})`);
                        }
                      }

                      if (failed.length > 0) {
                        core.setFailed(`Deploy guard bloqueado. Checks no conformes: ${failed.join(", ")}`);
                        return;
                      }

                      core.info("Deploy guard OK: todos los checks requeridos están en estado válido.");
