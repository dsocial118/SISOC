name: Documentacion automatica de PR

permissions:
    contents: read
    pull-requests: read

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - edited
        branches:
            - development
            - homologacion
            - main

jobs:
    generate_pr_artifacts:
        if: github.event.sender.login != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'development' && github.event.pull_request.head.ref != 'homologacion' && github.event.pull_request.head.ref != 'main'
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest

        steps:
            - name: Checkout branch del PR
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v6.2.0
              with:
                  python-version: "3.11.15"

            - name: Generar artefactos spec-as-source
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_EVENT_PATH: ${{ github.event_path }}
              run: python scripts/ci/pr_doc_automation.py

            - name: Commit automatico de artefactos
              run: |
                  changes="$(git status --porcelain --untracked-files=all -- docs/registro/prs docs/contexto/features docs/registro/releases/pending CHANGELOG.md)"
                  if [ -z "$changes" ]; then
                    echo "No hay cambios generados para commitear."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add docs/registro/prs docs/contexto/features docs/registro/releases/pending CHANGELOG.md
                  git commit -m "docs(ci): actualizar artefactos automaticos del PR #${{ github.event.pull_request.number }}"
                  git push

    sync_pr_artifacts:
        needs: generate_pr_artifacts
        # Las ramas protegidas no se autoescriben, pero deben traer sus
        # artefactos ya generados para que una promoción no saltee el gate.
        if: always()
        runs-on: ubuntu-latest

        steps:
            - name: Checkout base confiable del PR
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0

            - name: Verificar artefactos spec-as-source en la rama origen
              run: |
                  if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
                    git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/pr-head"
                  else
                    git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
                  fi

                  paths="$(git ls-tree -r --name-only refs/remotes/origin/pr-head -- docs/registro/prs docs/contexto/features docs/registro/releases/pending CHANGELOG.md)"
                  record_path="docs/registro/prs/PR-${{ github.event.pull_request.number }}.md"
                  feature_pattern="^docs/contexto/features/pr-${{ github.event.pull_request.number }}-.*\\.md$"
                  missing=()

                  if ! grep -Fxq "$record_path" <<< "$paths"; then
                    missing+=("$record_path")
                  fi
                  if ! grep -Eq "$feature_pattern" <<< "$paths"; then
                    missing+=("docs/contexto/features/pr-${{ github.event.pull_request.number }}-*.md")
                  fi
                  if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
                    release_pattern="^docs/registro/releases/pending/.*-pr-${{ github.event.pull_request.number }}\\.md$"
                    if ! grep -Eq "$release_pattern" <<< "$paths"; then
                      missing+=("docs/registro/releases/pending/*-pr-${{ github.event.pull_request.number }}.md")
                    fi
                    if ! grep -Fxq "CHANGELOG.md" <<< "$paths"; then
                      missing+=("CHANGELOG.md")
                    fi
                  fi

                  if [ "${#missing[@]}" -eq 0 ]; then
                    echo "Artefactos spec-as-source presentes en la rama origen."
                    exit 0
                  fi

                  protected_source=false
                  if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && \
                    { [ "${{ github.event.pull_request.head.ref }}" = "development" ] || \
                      [ "${{ github.event.pull_request.head.ref }}" = "homologacion" ] || \
                      [ "${{ github.event.pull_request.head.ref }}" = "main" ]; }; then
                    protected_source=true
                  fi

                  {
                    if [ "$protected_source" = true ]; then
                      echo "### Advertencia: artefactos spec-as-source pendientes"
                    else
                      echo "### Artefactos spec-as-source pendientes"
                    fi
                    echo ""
                    echo "Faltan los siguientes paths en la rama origen:"
                    echo '```text'
                    printf '%s\n' "${missing[@]}"
                    echo '```'
                    echo "Regenerá y commiteá los artefactos con \`python scripts/ci/pr_doc_automation.py --repository ${{ github.repository }} --pr ${{ github.event.pull_request.number }}\`."
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$protected_source" = true ]; then
                    echo "La rama origen está protegida; los artefactos faltantes no bloquean esta promoción."
                    exit 0
                  fi

                  echo "Faltan artefactos spec-as-source requeridos para mergear."
                  exit 1
