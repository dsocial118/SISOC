# Generated PWA locations. Include INSIDE the canonical HTTPS server.

location = /mobile { return 302 /mobile/$is_args$args; }

location ^~ /mobile/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;
}

location = /pwa/espacioscomunitarios { return 302 /pwa/espacioscomunitarios/$is_args$args; }

location ^~ /pwa/espacioscomunitarios/ {
    proxy_pass http://127.0.0.1:8080/pwa/espacioscomunitarios/;
